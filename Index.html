<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
</head>

<body style="margin:0; font-family:Arial; background:linear-gradient(135deg,#4facfe,#00f2fe); display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;">

<div style="background:white; padding:30px; border-radius:20px; width:300px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.2); animation:fadeIn 1.2s ease;">

<h2 style="margin-bottom:20px;">Login</h2>

<input id="name" type="text" placeholder="Enter Name"
style="width:90%; padding:10px; margin:10px 0; border-radius:10px; border:1px solid #ccc; outline:none; transition:0.3s;"
onfocus="this.style.border='1px solid #4facfe'"
onblur="this.style.border='1px solid #ccc'">

<input id="password" type="password" placeholder="Enter Password"
style="width:90%; padding:10px; margin:10px 0; border-radius:10px; border:1px solid #ccc; outline:none; transition:0.3s;"
onfocus="this.style.border='1px solid #4facfe'"
onblur="this.style.border='1px solid #ccc'">

<button onclick="login()"
style="width:95%; padding:10px; margin-top:15px; border:none; border-radius:10px; background:#4facfe; color:white; font-size:16px; cursor:pointer; transition:0.3s;"
onmouseover="this.style.transform='scale(1.05)'; this.style.background='#00c6ff'"
onmouseout="this.style.transform='scale(1)'; this.style.background='#4facfe'">
Login
</button>

<p id="message" style="margin-top:20px; font-weight:bold;"></p>

</div>

<style>
@keyframes fadeIn {
0% {opacity:0; transform:translateY(30px);}
100% {opacity:1; transform:translateY(0);}
}

@keyframes pop {
0% {transform:scale(0.5); opacity:0;}
100% {transform:scale(1); opacity:1;}
}
</style>

<script>
function login() {
var username = document.getElementById("name").value;
var password = document.getElementById("password").value;
var msg = document.getElementById("message");

if(username==="" || password===""){
msg.innerHTML="Please enter name and password";
msg.style.color="red";
msg.style.animation="fadeIn 0.5s";
}
else{
msg.innerHTML="@"+username+" welcome to login world 🌎";
msg.style.color="green";
msg.style.animation="pop 0.5s";
}
}
</script>

</body>
    </html>
